services:
  postgres:
    image: postgres:16-alpine
    container_name: artgallery-postgres
    environment:
      POSTGRES_DB: artgallery
      POSTGRES_USER: artgallery
      POSTGRES_PASSWORD: artgallery
    ports:
      - "5432:5432"
    volumes:
      - artgallery_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artgallery -d artgallery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artgallery_pg:
